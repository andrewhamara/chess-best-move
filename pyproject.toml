[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoagent-chess-best-move"
version = "0.3.0"
description = "Find the best move in a chess position read from a board image, checked against every forced mate: a NanoAgent plugin"
requires-python = ">=3.12"
dependencies = ["mcp>=1.27,<2", "slimconfig", "pillow>=11,<13"]

[project.optional-dependencies]
# python-chess builds the boards and their answers (tools_dev/make_boards.py); the plugin never imports it.
dev = ["pytest", "ruff", "chess>=1.10,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
slimconfig = { git = "https://github.com/zeyuyang8/slimconfig", branch = "master" }

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
# tests/ import contract.py and the verifier package from the plugin root.
pythonpath = ["."]
