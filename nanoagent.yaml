_ > nanoagent.plugin.v0001.ManifestConfig:
id: chess-best-move
name: Chess Best Move
version: 0.3.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  read_board:
    description: Read the position on a bundled chess board image, square by square from its pixels, as each side's pieces by square; it never says which move is best

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  best-move:
    description: Find the mating move on a chess board image for the side to move. The agent can run out of room and end without an answer; then run this task again, up to three times, and never work out a move yourself
    runner: agent
    tools: [read_board]
    reference: null
    instructions: |-
      Call read_board once with the board. It lists each side's pieces by square (e.g. Kd3, Bd2, Pa2: K Q R B N P are king, queen, rook, bishop, knight, pawn). The side to move (to_move) has a checkmate in one move.
      Do not reason, analyze or check variations. As soon as read_board answers, pick the mating move on instinct and call submit with the board and to_move, as given, and the move in UCI (from square, to square, e.g. a2a1). Your first reply after read_board must be the submit call, with no thinking before it.
  show-board:
    description: Show one of the board images, 1 to 50, only when the person asks to see a board; it does not find moves
    runner: tool
    tools: [read_board]
    reference: null
    instructions: Call read_board with the board, 1 to 50, and return its rows.
