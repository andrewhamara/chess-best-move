_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "Find the winning move on a chess board image"
summary: "Ask for the best move on one of 50 board images from real Lichess games: boards 1 to 25 are white to move, 26 to 50 black to move."
highlights:
  - "Real Lichess puzzles: every board has exactly one checkmate in one move"
  - "Each answer is checked against every legal move and every forced mate"
steps:
  - "Ask, e.g. find the best move on board 7, white to move (or board 30, black to move)"
  - "See the board with the agent's move drawn on it, checked"
